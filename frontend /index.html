<!DOCTYPE html>
<!--
  index.html - The game board, shown inside the Streamlit app.

  Streamlit loads this page in a small frame (a "custom component").
  It only contains the board; all buttons, scores and settings live in app.py.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Arena Board</title>
  <!-- Same fonts as the main page (the board is a separate frame). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600;700&display=swap" />
  <style>
    :root {
      --bg: #070b14;
      --panel: #0d1424;
      --border: #1d2a44;
      --neon: #39ff14;
      --food: #ff5a36;
      --text: #e6edf3;
      --muted: #8b98b0;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .board-wrap {
      position: relative;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 10px;
      border-radius: 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 0 0 1px rgba(57, 255, 20, 0.06), 0 18px 50px rgba(0, 0, 0, 0.55);
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      background: var(--bg);
      outline: none;
      touch-action: none; /* lets us read swipes without scrolling the page */
    }
    canvas:focus-visible { box-shadow: 0 0 0 2px rgba(57, 255, 20, 0.5); }

    /* Message shown on top of the board (Ready / Paused / Game Over). */
    .overlay {
      position: absolute;
      inset: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      text-align: center;
      border-radius: 12px;
      background: rgba(7, 11, 20, 0.78);
      backdrop-filter: blur(3px);
      transition: opacity 0.2s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h2 {
      margin: 0;
      font-family: "Orbitron", "Segoe UI", sans-serif;
      font-size: clamp(22px, 6vw, 38px);
      letter-spacing: 0.08em;
      color: var(--neon);
      text-shadow: 0 0 18px rgba(57, 255, 20, 0.55);
    }
    .overlay.danger h2 { color: var(--food); text-shadow: 0 0 18px rgba(255, 90, 54, 0.6); }
    .overlay p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
    .overlay .big { color: var(--text); font-size: 20px; font-weight: 700; }
    .overlay .badge {
      margin-top: 4px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #0b0f1a;
      background: var(--neon);
    }
    kbd {
      display: inline-block;
      min-width: 22px;
      padding: 1px 6px;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: #111a2e;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
    }
  </style>
</head>
<body>
  <div class="board-wrap" id="board-wrap">
    <canvas id="board" tabindex="0" aria-label="Snake game board"></canvas>
    <div class="overlay" id="overlay" role="status" aria-live="polite"></div>
  </div>

  <!-- The rules first, then the code that draws the board and reads keys. -->
  <script src="snake_engine.js"></script>
  <script src="main.js"></script>
</body>
</html>
